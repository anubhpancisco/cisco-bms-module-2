<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <style id="mighty-reset-css">/* Basic reset - lowest priority */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: sans-serif; line-height: 1.5; }</style><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull to reveal</title>
    
    <style>
        .pulltab {
            --progress: 0;
            --tab-color: #6B7280;
            --chevron-color: #FFFFFF;
            --line: rgba(128, 128, 128, 0.7);
            --gap: clamp(20px, 5%, 48px);
            --pad: 32px;
            --tab-w: 40px;
            --tab-h: 80px;
            /* Breathing room on each side of the tab: answer, tab, instructions. */
            --tab-gap: 40px;
            --dur-base: 1.7s;
            --dur: var(--dur-base);
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            font-family: inherit;
            color: inherit;
        }

        @supports (color: color-mix(in srgb, red, blue)) {
            .pulltab {
                --line: color-mix(in srgb, currentColor 45%, transparent);
            }
        }

        .pulltab .stage {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .pulltab .question-pane {
            min-width: 0;
            box-sizing: border-box;
            padding: var(--pad) calc(var(--gap) + 24px) var(--pad) 0;
            display: flex;
            align-items: center;
        }

        .pulltab .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.32;
            letter-spacing: -0.01em;
        }

        .pulltab .question-text > * {
            margin: 0;
            font-size: inherit;
            line-height: inherit;
        }

        .pulltab .question-text > * + * {
            margin-top: 0.5em;
        }

        /* Sits in the answer pane and is swept aside as the answer arrives. */
        .pulltab .hint {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            /* Left padding clears the tab, which rests against this pane's edge. */
            padding: var(--pad) var(--gap) var(--pad) calc(var(--tab-w) + var(--tab-gap));
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 0.95rem;
            line-height: 1.5;
            pointer-events: none;
            /* Fades at twice the pull rate, so it's gone by the halfway point. */
            opacity: calc(1 - var(--progress) * 2);
            /* Mirrors the tab's own travel, so the gap between them never changes. */
            transform: translateX(calc(var(--progress) * (100% - var(--tab-w))));
            transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
        }

        .pulltab .hint > * {
            margin: 0;
            font-size: inherit;
            line-height: inherit;
        }

        .pulltab .hint > * + * {
            margin-top: 0.5em;
        }

        /* Only one set of instructions is ever rendered; the layout picks. */
        .pulltab .hint-stacked {
            display: none;
        }

        /* Both only exist for the stacked layout. Generating no box here keeps
           the side-by-side version laying out exactly as it did without them. */
        .pulltab .answer-collapse,
        .pulltab .tab-row {
            display: contents;
        }

        .pulltab .answer-pane-wrap {
            min-width: 0;
            position: relative;
            overflow: hidden;
            border-left: 1px solid var(--line);
        }

        .pulltab .answer-inner {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: var(--pad) calc(var(--tab-w) + var(--tab-gap)) var(--pad) var(--gap);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform: translateX(calc((var(--progress) - 1) * (100% - var(--tab-w))));
            transition: transform var(--dur) var(--ease);
        }

        .pulltab .answer-inner:focus {
            outline: none;
        }

        .pulltab .answer-inner p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        .pulltab .answer-inner p + p {
            margin-top: 1.1em;
        }

        .pulltab.dragging .answer-inner,
        .pulltab.dragging .tab,
        .pulltab.dragging .tab-line,
        .pulltab.dragging .hint {
            transition: none;
        }

        /* Sits exactly on the divider at rest, then travels with the tab and
           shrinks toward it, staying centred on the handle the whole way. */
        .pulltab .tab-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: calc(var(--progress) * (100% - var(--tab-w)) - 1px);
            width: 1px;
            background: var(--line);
            pointer-events: none;
            opacity: calc(1 - var(--progress));
            transform: scaleY(calc(1 - var(--progress) * 0.75));
            transition: left var(--dur) var(--ease), opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
        }

        .pulltab .tab {
            position: absolute;
            top: 50%;
            left: calc(var(--progress) * (100% - var(--tab-w)));
            width: var(--tab-w);
            height: var(--tab-h);
            transform: translateY(-50%);
            border: none;
            border-radius: 0 999px 999px 0;
            background: var(--tab-color);
            color: var(--chevron-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: grab;
            touch-action: none;
            opacity: calc(1 - var(--progress));
            transition: left var(--dur) var(--ease), opacity var(--dur) var(--ease);
        }

        .pulltab .tab::before {
            content: "";
            position: absolute;
            inset: -10px;
        }

        .pulltab .tab:active {
            cursor: grabbing;
        }

        .pulltab .tab:focus-visible {
            outline: 2px solid var(--tab-color);
            outline-offset: 3px;
        }

        .pulltab .tab svg {
            width: 22px;
            height: 22px;
        }

        .pulltab.revealed .tab,
        .pulltab.revealed .tab-line {
            opacity: 0;
            visibility: hidden;
        }

        @media (max-width: 720px) {
            .pulltab {
                --tab-w: 84px;
                --tab-h: 42px;
                --pad: 28px;
                /* Vertical room is scarcer than horizontal, so the gap tightens. */
                --tab-gap: 28px;
            }

            .pulltab .stage {
                grid-template-columns: 1fr;
            }

            .pulltab .question-pane {
                padding: var(--pad) 0;
            }

            /* Stacked, this is a disclosure rather than a pull: the answer has
               no height at all until it opens, so a long answer no longer
               leaves a tall empty pane sitting behind the instructions. */
            .pulltab .answer-pane-wrap {
                border-left: none;
                border-top: 1px solid var(--line);
                display: grid;
                grid-template-rows: auto 0fr;
                transition: grid-template-rows var(--dur) var(--ease);
            }

            .pulltab.revealed .answer-pane-wrap {
                grid-template-rows: auto 1fr;
            }

            .pulltab .answer-collapse {
                display: block;
                grid-row: 2;
                min-height: 0;
                overflow: hidden;
            }

            .pulltab .answer-inner {
                height: auto;
                padding: var(--tab-gap) 0 var(--pad);
                justify-content: flex-start;
                transform: none;
            }

            /* The tab and instructions sit in a static row beneath the divider,
               then fold away as the answer takes their place. */
            .pulltab .tab-row {
                display: flex;
                grid-row: 1;
                flex-direction: column;
                align-items: center;
                gap: var(--tab-gap);
                max-height: 240px;
                overflow: hidden;
                transition: max-height var(--dur) var(--ease);
            }

            .pulltab.revealed .tab-row {
                max-height: 0;
            }

            .pulltab .hint {
                position: static;
                inset: auto;
                width: 100%;
                min-width: 0;
                padding: 0;
                text-align: center;
                transform: none;
                transition: opacity var(--dur) var(--ease);
            }

            /* Nothing for it to travel alongside once the tab stops moving. */
            .pulltab .tab-line {
                display: none;
            }

            .pulltab .tab {
                position: static;
                flex: none;
                transform: none;
                border-radius: 0 0 999px 999px;
                padding: 0;
                /* Tap only here, so a thumb landing on the tab still scrolls. */
                touch-action: auto;
                transition: opacity var(--dur) var(--ease);
            }

            .pulltab .hint-wide {
                display: none;
            }

            .pulltab .hint-stacked {
                display: flex;
            }

            .pulltab .tab svg {
                transform: rotate(90deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulltab .answer-inner,
            .pulltab .tab,
            .pulltab .tab-line,
            .pulltab .hint {
                transition-duration: 0.01ms;
            }
        }
    </style>
<script id="mighty-interactive-sdk" src="../../../../mighty/sdk/v1/mighty-interactive-sdk.min.js"></script></head>
<body>
    <div class="pulltab" id="root">
        <div class="stage">
            <div class="question-pane">
                <div>
                    <div class="question-text" data-form-key="question"></div>
                </div>
            </div>
            <div class="answer-pane-wrap" id="answerWrap">
                <div class="answer-collapse">
                    <div class="answer-inner" id="answerInner" tabindex="-1" data-form-key="answer"></div>
                </div>
                <div class="tab-row">
                    <div class="tab-line"></div>
                    <button type="button" class="tab" id="tabHandle" aria-expanded="false" aria-controls="answerInner" aria-label="Reveal the answer">
                        <!-- Google Material Symbols "chevron_right" -->
                        <svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
                            <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"></path>
                        </svg>
                    </button>
                    <div class="hint hint-wide" data-form-key="hint"></div>
                    <div class="hint hint-stacked" data-form-key="hintStacked"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sdk = window.mightyInteractiveSdk;

        sdk.onSdkReady(async () => {
            sdk.registerTracking({
                completion: { description: 'Marks complete the first time the learner fully reveals the answer.' },
            });

            const state = await sdk.state.getState({
                question: '<p>Why do learners forget most of what they hear in a training session?</p>',
                hint: '<p>Pull or select to reveal.</p>',
                hintStacked: '<p>Select to reveal.</p>',
                answer: '<p>Memory decays quickly without reinforcement. Research on the forgetting curve suggests that much of what someone learns slips away within a day or two, and the drop is steepest right after the session ends. That is not a failure of attention. It is how memory behaves when information is met once and never revisited.</p><p>Retrieval is what slows the decline. Each time a learner pulls an idea back out of memory, by answering a question, explaining it to a colleague, or applying it to real work, that memory is rebuilt a little stronger. Spacing those moments across days or weeks does more for retention than one longer session ever will.</p>',
                tabColor: '#6B7280',
                chevronColor: '#FFFFFF',
            });

            const root = document.getElementById('root');
            root.style.setProperty('--tab-color', state.tabColor || '#6B7280');
            root.style.setProperty('--chevron-color', state.chevronColor || '#FFFFFF');

            // Left unset, --line derives from the surrounding text color so it
            // adapts to light/dark lessons. An author choice overrides it.
            if (state.lineColor) {
                root.style.setProperty('--line', state.lineColor);
            }

            document.querySelector('[data-form-key="question"]').innerHTML = state.question;
            document.querySelector('[data-form-key="hint"]').innerHTML = state.hint;
            document.querySelector('[data-form-key="hintStacked"]').innerHTML = state.hintStacked;
            document.querySelector('[data-form-key="answer"]').innerHTML = state.answer;

            const wrap = document.getElementById('answerWrap');
            const answer = document.getElementById('answerInner');
            const tab = document.getElementById('tabHandle');
            const hints = document.querySelectorAll('.hint');

            let progress = 0;
            let dragging = false;
            let pointerMoved = false;
            let startPointer = 0;
            let startProgress = 0;
            let completed = false;

            // Must stay in step with the stacked-layout media query above.
            const isStacked = () => window.matchMedia('(max-width: 720px)').matches;

            function setProgress(next) {
                progress = Math.min(1, Math.max(0, next));
                root.style.setProperty('--progress', progress);

                const revealed = progress >= 1;
                tab.setAttribute('aria-expanded', revealed ? 'true' : 'false');
                answer.setAttribute('aria-hidden', revealed ? 'false' : 'true');
                hints.forEach((el) => el.setAttribute('aria-hidden', revealed ? 'true' : 'false'));

                if (!dragging) {
                    root.classList.toggle('revealed', revealed);
                }

                if (revealed && !completed) {
                    completed = true;
                    sdk.markAsComplete();
                }
            }

            setProgress(0);

            const baseDur = parseFloat(getComputedStyle(root).getPropertyValue('--dur-base')) || 1.7;

            // Picks up where the drag stopped and keeps roughly the same pace,
            // so a nearly-finished pull doesn't sit through a full-length glide.
            function completeReveal() {
                root.style.setProperty('--dur', Math.max(0.3, baseDur * (1 - progress)) + 's');
                setProgress(1);
            }

            tab.addEventListener('pointerdown', (event) => {
                // Stacked, the tab is tap-only: claiming a vertical drag here
                // would swallow the page scroll of anyone whose thumb lands on it.
                if (isStacked()) return;
                dragging = true;
                pointerMoved = false;
                startProgress = progress;
                startPointer = isStacked() ? event.clientY : event.clientX;
                root.classList.add('dragging');
                tab.setPointerCapture(event.pointerId);
            });

            tab.addEventListener('pointermove', (event) => {
                if (!dragging) return;
                const current = isStacked() ? event.clientY : event.clientX;
                const delta = current - startPointer;
                if (Math.abs(delta) > 4) pointerMoved = true;
                const rect = wrap.getBoundingClientRect();
                const size = isStacked() ? rect.height : rect.width;
                setProgress(startProgress + delta / size);
            });

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                root.classList.remove('dragging');
                if (!pointerMoved) {
                    root.classList.toggle('revealed', progress >= 1);
                    return;
                }
                completeReveal();
            }

            tab.addEventListener('pointerup', endDrag);
            tab.addEventListener('pointercancel', endDrag);

            tab.addEventListener('click', (event) => {
                if (pointerMoved) {
                    pointerMoved = false;
                    return;
                }
                completeReveal();
                // detail === 0 means the click came from the keyboard, not a pointer.
                // The tab is now hidden, so send focus to the answer it revealed.
                if (event.detail === 0) {
                    answer.focus({ preventScroll: true });
                }
            });
        });
    </script>
