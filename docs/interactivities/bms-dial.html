  :root {
    --mid: #07182D; --med: #0A60FF; --cis: #02C8FF; --line: #D6E0EC; --soft: #F3F8FE; --muted: #4A5B70;
    --pol: #F2B01E; --pol-ink: #8A5A00; --pro: #02A8E8; --pro-ink: #04709E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--mid); -webkit-font-smoothing: antialiased; line-height: 1.3; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; text-align: left; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--cis); outline-offset: 3px; }
  #topline { height: 6px; width: 100%; background: linear-gradient(90deg, #7C5CFA 0%, #0A60FF 22%, #02C8FF 45%, #12B5A6 62%, #F2B01E 80%, #FF7A1A 100%); }
  .bms { position: relative; overflow: hidden; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .g1 { width: 760px; height: 760px; left: -260px; top: -120px; background: radial-gradient(closest-side, rgba(2,200,255,.10), rgba(2,200,255,0)); }
  .g2 { width: 640px; height: 640px; right: -220px; top: -200px; background: radial-gradient(closest-side, rgba(255,122,26,.10), rgba(255,122,26,0)); }
  .g3 { width: 700px; height: 700px; right: 10%; bottom: -380px; background: radial-gradient(closest-side, rgba(124,92,250,.09), rgba(124,92,250,0)); }
  .wrap { position: relative; max-width: 1120px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 32px) 30px; }
  .eb { font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--med); margin: 0 0 10px; }

  /* instruction + progress row */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 18px; }
  .hintbar { display: flex; align-items: center; gap: 10px; font-size: clamp(16px, 2vw, 20px); font-weight: 600; letter-spacing: -.01em; color: var(--mid); }
  .hintbar svg { flex: none; animation: nudge 2.6s ease-in-out infinite; }
  @keyframes nudge { 0%,60%,100% { transform: translate(0,0); } 75% { transform: translate(3px,3px); } }
  .prog { text-align: right; margin-left: auto; }
  .prog b { display: block; font-weight: 500; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--med); margin-bottom: 7px; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 5px; justify-content: flex-end; }
  .pip { width: 26px; height: 8px; border-radius: 4px; background: #E3EAF3; transition: background .5s ease, transform .5s cubic-bezier(.3,1.6,.5,1); }
  .pip.on { transform: scaleY(1.25); }

  /* family colours: one accent per family, tints for fills, ink for text */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-weight: 500; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

  /* shared ring-icon + visited tick */
  .ring { border-radius: 50%; background: #fff; border: 2.5px solid var(--ac); display: grid; place-items: center; flex: none; position: relative; box-shadow: 0 6px 16px var(--g); }
  .ok { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); border: 2px solid #fff; display: grid; place-items: center; right: -5px; top: -5px; transform: scale(0); transition: transform .45s cubic-bezier(.3,1.7,.5,1); }
  .vis .ok { transform: scale(1); }

  /* detail panel (used by options B and C) */

  /* No grouping/tagging in this version: one brand colour set, elements in slide order */

  var ALL = { id: 'all', name: 'BMS', icon: 'layers', ac: '#0A60FF', ink: '#0947B6', blurb: '', items: ITEMS };
  ITEMS.forEach(function (it) { it.f = ALL; }); FAMS.length = 0; FAMS.push(ALL);
  initChrome();
  var stage = document.getElementById('stage'), dial = document.getElementById('dial'), panel = document.getElementById('panel'), beam = document.getElementById('beam');
  var legendEl = document.getElementById('legend'); if (legendEl) legendEl.remove();

  function measure() {

  }
  function P(r, a) { var t = a * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; }

    var ar = R - D * .82;

    var ar2 = R - D * .82, q1 = P(ar2, -17), q2 = P(ar2, 17);

    s += '<path d="M' + f2(q1[0]) + ' ' + f2(q1[1]) + ' A' + f2(ar2) + ' ' + f2(ar2) + ' 0 0 1 ' + f2(q2[0]) + ' ' + f2(q2[1]) + '" fill="none" stroke="#02C8FF" stroke-width="4" stroke-linecap="round"/>';
    s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (HR + 8) + '" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3.5"/>';
    s += '<circle class="prg' + (started ? ' on' : '') + '" id="prg" cx="' + CX + '" cy="' + CY + '" r="' + (HR + 8) + '" fill="none" stroke="#02C8FF" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="' + (100 - 100 * visitedCount() / total) + '" transform="rotate(-90 ' + CX + ' ' + CY + ')"/>';
    s += '</svg>';

  }
  function norm(a) { return ((a % 360) + 540) % 360 - 180; }

    nodes.forEach(function (n, i) {
      var a = i * STEP - rot, na = Math.abs(norm(a)), op = na < 1 ? 1 : na < 50 ? .97 : na < 95 ? .82 : 0, x = CX + R * Math.cos(a * Math.PI / 180), focus = i === cur;

      n.el.style.opacity = op; n.el.classList.toggle('show', op > 0); n.el.classList.toggle('focus', focus); n.el.classList.toggle('cue', !started);

      beam.style.setProperty('--ac', it.f.ac); beam.classList.toggle('on', started);

  function build() {

    nodes.forEach(function (n) { n.el.remove(); }); nodes = [];
    if (hubEl) hubEl.remove();
    ITEMS.forEach(function (it, i) {
      var el = h('button', 'dn cue'); el.type = 'button'; theme(el, it.f); el.setAttribute('aria-label', it.name + ', ' + it.f.name);
      var dsk = h('span', 'dsk'); dsk.appendChild(icon(it.icon, Math.round(D * .48), it.f.ink, 1.9));
      var ok = h('span', 'ok'); ok.appendChild(icon('check', 10, '#fff', 3.6)); dsk.appendChild(ok); if (visited[it.id]) el.classList.add('vis');
      var lb = h('span', 'lb', it.name);
      el.appendChild(dsk); el.appendChild(lb);
      el.addEventListener('click', function () { if (swallow) return; select(i); });
      el.addEventListener('keydown', function (e) {
        var k = e.key; if (k === 'ArrowDown' || k === 'ArrowRight') { e.preventDefault(); select((cur + 1) % total, true); } else if (k === 'ArrowUp' || k === 'ArrowLeft') { e.preventDefault(); select((cur + total - 1) % total, true); }

    hubEl = h('div', 'hub'); hubEl.appendChild(h('b', null, 'Core Process Elements')); hubc = h('span', null, hubText()); hubEl.appendChild(hubc); dial.appendChild(hubEl);
    render(true);
  }
  function hubText() { var n = visitedCount(); return n === total ? 'All explored' : n + ' / ' + total + ' explored'; }
  function select(i, focusIt) {

    nodes[i].el.classList.add('vis');

    if (focusIt) nodes[i].el.focus({ preventScroll: true });

  listeners.push(function (id, n) {
    prgEl.classList.add('on'); prgEl.style.strokeDashoffset = String(100 - 100 * n / total); hubc.textContent = hubText();
    if (n === total && !complete) {

    }
  });
  /* swipe / drag up or down on the dial to turn it */
  var y0 = null;
  dial.addEventListener('pointerdown', function (e) { y0 = e.clientY; swallow = false; });
  dial.addEventListener('pointerup', function (e) {

  });

  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(build, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { build(); });
