<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cisco's Business Management System</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
    #course { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
  <script>
    /*
     * Minimal in-memory SCORM 2004 runtime.
     * The Rise export only plays when a SCORM API is found in a parent window
     * (it shows "Content launched outside of a supported LMS environment"
     * otherwise). This page plays the role of the LMS so the unmodified
     * package in this folder runs exactly as exported from Rise.
     * Nothing is stored: every visit starts the course from the beginning.
     */
    (function () {
      var data = {
        "cmi._version": "1.0",
        "cmi.mode": "normal",
        "cmi.credit": "credit",
        "cmi.entry": "ab-initio",
        "cmi.launch_data": "dataFromLMS",
        "cmi.learner_id": "learner",
        "cmi.learner_name": "Learner",
        "cmi.completion_status": "unknown",
        "cmi.success_status": "unknown",
        "cmi.location": "",
        "cmi.suspend_data": "",
        "cmi.exit": "",
        "cmi.progress_measure": "",
        "cmi.score.scaled": "",
        "cmi.score.raw": "",
        "cmi.score.min": "",
        "cmi.score.max": "",
        "cmi.total_time": "PT0H0M0S",
        "cmi.session_time": "",
        "cmi.completion_threshold": "",
        "cmi.scaled_passing_score": "",
        "cmi.max_time_allowed": "",
        "cmi.time_limit_action": "continue,no message",
        "cmi.learner_preference.audio_level": "1",
        "cmi.learner_preference.language": "",
        "cmi.learner_preference.delivery_speed": "1",
        "cmi.learner_preference.audio_captioning": "0",
        "cmi.comments_from_learner._count": "0",
        "cmi.comments_from_lms._count": "0",
        "cmi.interactions._count": "0",
        "cmi.objectives._count": "0",
        "adl.nav.request": "_none_"
      };
      var readOnly = {
        "cmi._version": 1, "cmi.mode": 1, "cmi.credit": 1, "cmi.entry": 1,
        "cmi.launch_data": 1, "cmi.learner_id": 1, "cmi.learner_name": 1,
        "cmi.total_time": 1, "cmi.completion_threshold": 1,
        "cmi.scaled_passing_score": 1, "cmi.max_time_allowed": 1,
        "cmi.time_limit_action": 1
      };
      var children = {
        "cmi.score._children": "scaled,raw,min,max",
        "cmi.learner_preference._children": "audio_level,language,delivery_speed,audio_captioning",
        "cmi.interactions._children": "id,type,objectives,timestamp,correct_responses,weighting,learner_response,result,latency,description",
        "cmi.objectives._children": "id,score,success_status,completion_status,description",
        "cmi.comments_from_learner._children": "comment,location,timestamp",
        "cmi.comments_from_lms._children": "comment,location,timestamp"
      };
      var state = "not-initialized"; // not-initialized | running | terminated
      var err = "0";

      function ok() { err = "0"; return "true"; }
      function fail(code) { err = String(code); return "false"; }

      window.API_1484_11 = {
        Initialize: function () {
          if (state === "running") return fail(103);
          if (state === "terminated") return fail(104);
          state = "running"; return ok();
        },
        Terminate: function () {
          if (state !== "running") return fail(state === "terminated" ? 113 : 112);
          state = "terminated"; return ok();
        },
        GetValue: function (key) {
          if (state !== "running") { fail(state === "terminated" ? 123 : 122); return ""; }
          err = "0";
          if (children.hasOwnProperty(key)) return children[key];
          if (data.hasOwnProperty(key)) return data[key];
          if (/^cmi\.(interactions|objectives|comments_from_learner|comments_from_lms)\.\d+\./.test(key)) {
            err = "0"; return "";
          }
          err = "401"; return "";
        },
        SetValue: function (key, value) {
          if (state !== "running") return fail(state === "terminated" ? 133 : 132);
          if (readOnly[key]) return fail(404);
          data[key] = String(value);
          return ok();
        },
        Commit: function () {
          if (state !== "running") return fail(state === "terminated" ? 143 : 142);
          return ok();
        },
        GetLastError: function () { return err; },
        GetErrorString: function (code) {
          var m = { "0": "No error", "101": "General exception", "122": "Retrieve data before initialization",
                    "132": "Store data before initialization", "142": "Commit before initialization",
                    "401": "Undefined data model element", "404": "Data model element is read only" };
          return m[String(code)] || "";
        },
        GetDiagnostic: function () { return ""; }
      };
    })();
  </script>
</head>
<body>
  <iframe id="course"
          title="Cisco's Business Management System"
          src="scormdriver/indexAPI.html"
          allow="fullscreen; autoplay; clipboard-write"
          allowfullscreen></iframe>
</body>
</html>
